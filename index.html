<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ROVER - MQTT</title>

    <!-- MQTT JavaScript -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101010;
            color: white;
        }

        header {
            background: #181818;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .estado {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .desconectado {
            background: #401515;
            color: #ff7777;
        }

        .conectado {
            background: #153d20;
            color: #6cff8a;
        }

        .dato {
            background: #0c0c0c;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;

            font-family: monospace;
            font-size: 18px;

            word-wrap: break-word;
            white-space: pre-wrap;

            min-height: 100px;
        }

        input {
            width: 100%;

            padding: 14px;

            background: #0c0c0c;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 10px;
        }

        button {
            width: 100%;

            padding: 14px;

            background: #333;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .log {
            background: #0c0c0c;

            border: 1px solid #333;

            border-radius: 8px;

            padding: 15px;

            height: 250px;

            overflow-y: auto;

            font-family: monospace;

            font-size: 13px;
        }

        .log-line {
            margin-bottom: 8px;
        }

        .verde {
            color: #6cff8a;
        }

        .rojo {
            color: #ff7777;
        }

        .azul {
            color: #66b3ff;
        }

    </style>

</head>


<body>

<header>

    <h1>🚀 ROVER</h1>

    <p>Telemetría y control mediante MQTT</p>

</header>


<div class="container">


    <!-- ========================================= -->
    <!-- ESTADO MQTT -->
    <!-- ========================================= -->

    <div class="card">

        <h2>Estado MQTT</h2>

        <div id="estado"
             class="estado desconectado">

            MQTT DESCONECTADO

        </div>

    </div>


    <!-- ========================================= -->
    <!-- DATOS DEL ROVER -->
    <!-- ========================================= -->

    <div class="card">

        <h2>Datos recibidos</h2>

        <p>
            Topic:
            <strong>rover/sensores</strong>
        </p>

        <div id="datos"
             class="dato">

            Esperando datos del rover...

        </div>

    </div>


    <!-- ========================================= -->
    <!-- ENVIAR COMANDO -->
    <!-- ========================================= -->

    <div class="card">

        <h2>Enviar comando al rover</h2>

        <p>
            Topic:
            <strong>rover/comando</strong>
        </p>

        <input
            id="comando"
            type="text"
            placeholder="Escribe un comando o texto..."
        >

        <button onclick="enviarComando()">

            ENVIAR AL ROVER

        </button>

    </div>


    <!-- ========================================= -->
    <!-- LOG -->
    <!-- ========================================= -->

    <div class="card">

        <h2>Registro</h2>

        <div id="log"
             class="log">

        </div>

    </div>


</div>


<script>


// ============================================================
// CONFIGURACIÓN EMQX
// ============================================================

// IMPORTANTE:
//
// Reemplaza TU_HOST_EMQX por el hostname real de EMQX.
//
// Ejemplo:
//
// xxxxxxx.ala.eu-central-1.emqxsl.com
//
// Para WebSocket seguro:
// wss://HOST:8084/mqtt

const BROKER =
    "wss://TU_HOST_EMQX:8084/mqtt";


// ============================================================
// CREDENCIALES
// ============================================================

const MQTT_USER = "rover";
const MQTT_PASSWORD = "Rover2026";


// ============================================================
// TOPICS
// ============================================================

const TOPIC_DATOS =
    "rover/sensores";

const TOPIC_COMANDO =
    "rover/comando";


// ============================================================
// ELEMENTOS HTML
// ============================================================

const estado =
    document.getElementById("estado");

const datos =
    document.getElementById("datos");

const comando =
    document.getElementById("comando");

const log =
    document.getElementById("log");


// ============================================================
// CLIENT ID
// ============================================================

const CLIENT_ID =
    "WEB_ROVER_" +
    Math.random()
        .toString(16)
        .substring(2);


// ============================================================
// AGREGAR AL LOG
// ============================================================

function agregarLog(
    mensaje,
    clase = ""
)
{
    const linea =
        document.createElement("div");

    linea.className =
        "log-line " + clase;

    const hora =
        new Date().toLocaleTimeString();

    linea.textContent =
        "[" + hora + "] " + mensaje;

    log.appendChild(linea);

    log.scrollTop =
        log.scrollHeight;
}


// ============================================================
// CONECTAR A MQTT
// ============================================================

agregarLog(
    "Intentando conectar a EMQX..."
);

const client =
    mqtt.connect(
        BROKER,
        {

            clientId: CLIENT_ID,

            username: MQTT_USER,

            password: MQTT_PASSWORD,

            clean: true,

            connectTimeout: 10000,

            reconnectPeriod: 3000

        }
    );


// ============================================================
// MQTT CONECTADO
// ============================================================

client.on(
    "connect",
    function()
    {

        estado.textContent =
            "MQTT CONECTADO";

        estado.className =
            "estado conectado";

        agregarLog(
            "Conectado a EMQX",
            "verde"
        );


        // Suscribirse a sensores

        client.subscribe(
            TOPIC_DATOS,
            function(error)
            {

                if (error)
                {

                    agregarLog(
                        "Error suscribiendo a sensores",
                        "rojo"
                    );

                }
                else
                {

                    agregarLog(
                        "Suscrito a " +
                        TOPIC_DATOS,
                        "verde"
                    );

                }

            }
        );

    }
);


// ============================================================
// MQTT DESCONECTADO
// ============================================================

client.on(
    "close",
    function()
    {

        estado.textContent =
            "MQTT DESCONECTADO";

        estado.className =
            "estado desconectado";

        agregarLog(
            "MQTT desconectado",
            "rojo"
        );

    }
);


// ============================================================
// ERROR MQTT
// ============================================================

client.on(
    "error",
    function(error)
    {

        agregarLog(
            "Error MQTT: " +
            error.message,
            "rojo"
        );

    }
);


// ============================================================
// RECONNECT
// ============================================================

client.on(
    "reconnect",
    function()
    {

        agregarLog(
            "Intentando reconectar..."
        );

    }
);


// ============================================================
// RECIBIR DATOS DEL ROVER
// ============================================================

client.on(
    "message",
    function(topic, message)
    {

        const texto =
            message.toString();


        // Mostrar mensaje completo

        datos.textContent =
            texto;


        agregarLog(
            "Datos recibidos: " +
            texto,
            "azul"
        );

    }
);


// ============================================================
// ENVIAR COMANDO
// ============================================================

function enviarComando()
{

    const mensaje =
        comando.value.trim();


    if (mensaje === "")
    {

        alert(
            "Escribe un comando primero."
        );

        return;

    }


    if (!client.connected)
    {

        alert(
            "MQTT no está conectado."
        );

        return;

    }


    // Publicar comando

    client.publish(
        TOPIC_COMANDO,
        mensaje,
        {
            qos: 0,
            retain: false
        },
        function(error)
        {

            if (error)
            {

                agregarLog(
                    "Error enviando comando",
                    "rojo"
                );

            }
            else
            {

                agregarLog(
                    "Comando enviado: " +
                    mensaje,
                    "verde"
                );

            }

        }
    );


    // Limpiar campo

    comando.value = "";

}


// ============================================================
// ENTER PARA ENVIAR
// ============================================================

comando.addEventListener(
    "keydown",
    function(event)
    {

        if (event.key === "Enter")
        {

            enviarComando();

        }

    }
);


</script>


</body>

</html>
